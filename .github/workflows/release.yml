name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Package
        run: tar czf NotifMover.app.tar.gz NotifMover.app

      - name: Checksum
        run: shasum -a 256 NotifMover.app.tar.gz > NotifMover.app.tar.gz.sha256

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            NotifMover.app.tar.gz
            NotifMover.app.tar.gz.sha256
          generate_release_notes: true
