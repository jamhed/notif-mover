name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          SHA=$(curl -sL "https://github.com/jamhed/notif-mover/releases/download/${GITHUB_REF_NAME}/NotifMover.app.tar.gz.sha256" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update cask
        uses: actions/checkout@v4
        with:
          repository: jamhed/homebrew-notif-mover
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write cask
        run: |
          cat > tap/Casks/notif-mover.rb << 'CASK'
          cask "notif-mover" do
            version "${{ steps.release.outputs.version }}"
            sha256 "${{ steps.release.outputs.sha256 }}"

            url "https://github.com/jamhed/notif-mover/releases/download/v#{version}/NotifMover.app.tar.gz"
            name "NotifMover"
            desc "Move macOS 26 (Tahoe) notifications to bottom-right corner"
            homepage "https://github.com/jamhed/notif-mover"

            depends_on macos: ">= :sonoma"

            app "NotifMover.app"

            livecheck do
              url "https://github.com/jamhed/notif-mover/releases/latest"
              strategy :github_latest
            end
          end
          CASK

      - name: Push
        run: |
          cd tap
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update notif-mover to v${{ steps.release.outputs.version }}"
          git push
